
name: Update README activity

on:
  schedule:
    - cron: "30 18 * * *" # Daily at 12:00 AM IST
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/update_activity.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Rebuild activity block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          MAX_LINES: "10"
          TIMEZONE: Asia/Kolkata
          # SHOW_STARS: "true"
        run: python3 .github/scripts/update_activity.py

      - name: Commit activity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "⚡ Update README with recent activity"
            git push

          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((50 * 86400)) ]; then
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push
          fi
